[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "secrettriage"
version = "0.1.0"
description = "Leaked-secret triage engine – portfolio project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "streamlit>=1.35",
    "plotly>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
